# JVM memory for the Android build. 4 GB is enough for R8 with Firebase and
# keeps GitHub Actions' 7 GB runners comfortable.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX is required by every plugin in this project.
android.useAndroidX=true
android.enableJetifier=false

# R8 full mode shrinks harder: keep it on, and rely on proguard-rules.pro for
# the reflection-heavy plugins.
android.enableR8.fullMode=true

# Non-transitive R classes trim a few hundred KB of generated code.
android.nonTransitiveRClass=true

# Avoid the "resource shrinker found unused resources" churn in CI logs.
android.nonFinalResIds=true
