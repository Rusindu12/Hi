# Configuration for `flutter gen-l10n` (runs automatically on build because
# pubspec.yaml has `flutter: generate: true`).
#
# NOTE for Flutter 3.32+: the `synthetic-package` option was removed from the
# tool. If your SDK errors on it, delete that single line below - `output-dir`
# already forces on-disk generation, which is what we want.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n/generated
synthetic-package: false
nullable-getter: false
untranslated-messages-file: l10n_untranslated.json
